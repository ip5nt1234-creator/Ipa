<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة عبدالإله | توقيع وتثبيت تطبيقات iOS</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0e14;
      --card: #151921;
      --border: #232936;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --success: #238636;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 6px; }
    p.sub { text-align: center; color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }
    .group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text-dim); }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b0e14;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .file-box {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      background: #0b0e14;
      cursor: pointer;
    }
    .file-box input { display: none; }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-install {
      display: none;
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      background: var(--success);
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
    }
    .status { margin-top: 12px; text-align: center; font-size: 13px; color: #58a6ff; }
  </style>
</head>
<body>

<div class="card">
  <h1>منصة عبدالإله</h1>
  <p class="sub">رفع وتثبيت تطبيقات iOS من ملفات الجهاز مباشرة</p>

  <div class="group">
    <label>اختر ملف التطبيق (IPA):</label>
    <div class="file-box" onclick="document.getElementById('ipaFile').click()">
      <span id="ipaLabel">اضغط لاختيار ملف IPA من الآيفون</span>
      <input type="file" id="ipaFile" accept=".ipa" onchange="updateFileName(this, 'ipaLabel')">
    </div>
  </div>

  <div class="group">
    <label>اسم التطبيق:</label>
    <input type="text" id="appName" placeholder="مثال: تطبيقي">
  </div>

  <div class="group">
    <label>معرف الحزمة (Bundle ID):</label>
    <input type="text" id="bundleId" placeholder="مثال: com.abdulelah.app">
  </div>

  <button class="btn" id="actionBtn" onclick="processUpload()">رفع وتجهيز التثبيت</button>
  <div id="statusText" class="status"></div>

  <a id="installBtn" class="btn-install" href="#">تثبيت على الآيفون مباشرة</a>
</div>

<script>
function updateFileName(input, labelId) {
  if (input.files && input.files[0]) {
    document.getElementById(labelId).innerText = "تم اختيار: " + input.files[0].name;
  }
}

async function processUpload() {
  const fileInput = document.getElementById('ipaFile');
  const appName = document.getElementById('appName').value.trim() || 'تطبيق جديد';
  const bundleId = document.getElementById('bundleId').value.trim() || 'com.abdulelah.app';
  const status = document.getElementById('statusText');
  const actionBtn = document.getElementById('actionBtn');

  if (!fileInput.files || !fileInput.files[0]) {
    alert('يرجى اختيار ملف IPA من ملفات الجهاز أولاً.');
    return;
  }

  const file = fileInput.files[0];
  status.innerText = "جاري رفع الملف وتوليد الرابط المباشر... يرجى الانتظار";
  actionBtn.disabled = true;

  try {
    const formData = new FormData();
    formData.append('file', file);

    // رفع سحابي مؤقت مباشر يدعم HTTPS وروابط التحميل المباشرة لـ OTA
    const res = await fetch('https://tmpfiles.org/api/v1/upload', {
      method: 'POST',
      body: formData
    });

    const data = await res.json();

    if (data.status === 'success') {
      // تعديل الرابط ليصبح رابط تحميل مباشر لملف IPA
      const rawUrl = data.data.url;
      const directIpaUrl = rawUrl.replace('tmpfiles.org/', 'tmpfiles.org/dl/');

      // بناء ملف المانيفست (plist)
      const manifest = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>items</key>
  <array>
    <dict>
      <key>assets</key>
      <array>
        <dict>
          <key>kind</key>
          <string>software-package</string>
          <key>url</key>
          <string>${directIpaUrl}</string>
        </dict>
      </array>
      <key>metadata</key>
      <dict>
        <key>bundle-identifier</key>
        <string>${bundleId}</string>
        <key>bundle-version</key>
        <string>1.0</string>
        <key>kind</key>
        <string>software</string>
        <key>title</key>
        <string>${appName}</string>
      </dict>
    </dict>
  </array>
</dict>
</plist>`;

      // رفع المانيفست أيضاً لتوليد رابط plist عبر HTTPS
      const plistBlob = new Blob([manifest], { type: 'text/xml' });
      const plistForm = new FormData();
      plistForm.append('file', plistBlob, 'manifest.plist');

      const plistRes = await fetch('https://tmpfiles.org/api/v1/upload', {
        method: 'POST',
        body: plistForm
      });
      const plistData = await plistRes.json();
      const directPlistUrl = plistData.data.url.replace('tmpfiles.org/', 'tmpfiles.org/dl/');

      const otaUrl = `itms-services://?action=download-manifest&url=${encodeURIComponent(directPlistUrl)}`;

      const btn = document.getElementById('installBtn');
      btn.href = otaUrl;
      btn.style.display = 'block';
      btn.innerText = `تثبيت ${appName} على الآيفون`;

      status.innerText = "تم التجهيز بنجاح! اضغط الزر الأخضر بالأسفل لتثبيت التطبيق.";
    } else {
      status.innerText = "فشل الرفع، يرجى المحاولة مرة أخرى.";
    }
  } catch (err) {
    console.error(err);
    status.innerText = "حدث خطأ أثناء الرفع، تأكد من اتصال الإنترنت.";
  } finally {
    actionBtn.disabled = false;
  }
}
</script>

</body>
</html>
