<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة عبدالإله | تثبيت تطبيقات iOS</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #151921;
      --border: #232936;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --success: #238636;
      --error: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 6px; }
    p.sub { text-align: center; color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }
    .group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text-dim); }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b0e14;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    .file-box {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      background: #0b0e14;
      cursor: pointer;
      font-size: 14px;
    }
    .file-box input { display: none; }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-install {
      display: none;
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      background: var(--success);
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
    }
    .status { margin-top: 12px; text-align: center; font-size: 13px; color: #58a6ff; line-height: 1.5; }
    .error-msg { color: var(--error) !important; }
    .progress-bar-container {
      width: 100%;
      background: #0b0e14;
      border-radius: 8px;
      margin-top: 12px;
      height: 8px;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.2s ease;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>منصة عبدالإله</h1>
  <p class="sub">رفع وتثبيت تطبيقات iOS من ملفات الجهاز مباشرة</p>

  <div class="group">
    <label>اختر ملف التطبيق (IPA):</label>
    <div class="file-box" onclick="document.getElementById('ipaFile').click()">
      <span id="ipaLabel">اضغط لاختيار ملف IPA من الملفات</span>
      <input type="file" id="ipaFile" accept=".ipa" onchange="handleFileSelect(this)">
    </div>
  </div>

  <div class="group">
    <label>اسم التطبيق:</label>
    <input type="text" id="appName" placeholder="اسم التطبيق">
  </div>

  <div class="group">
    <label>معرف الحزمة (Bundle ID):</label>
    <input type="text" id="bundleId" placeholder="معرف الحزمة">
  </div>

  <button class="btn" id="actionBtn" onclick="processUpload()">رفع وتجهيز التثبيت</button>
  
  <div class="progress-bar-container" id="progContainer">
    <div class="progress-bar" id="progBar"></div>
  </div>

  <div id="statusText" class="status"></div>
  <a id="installBtn" class="btn-install" href="#">تثبيت التطبيق على الآيفون مباشرة</a>
</div>

<script>
let selectedFile = null;

async function handleFileSelect(input) {
  if (!input.files || !input.files[0]) return;
  selectedFile = input.files[0];
  document.getElementById('ipaLabel').innerText = "تم اختيار: " + selectedFile.name;
  
  const status = document.getElementById('statusText');
  status.classList.remove('error-msg');
  status.innerText = "جاري قراءة بيانات التطبيق الأصلية...";

  try {
    const zip = await JSZip.loadAsync(selectedFile);
    let plistFile = null;

    zip.forEach((relativePath, file) => {
      if (/^Payload\/[^\/]+\.app\/Info\.plist$/i.test(relativePath)) {
        plistFile = file;
      }
    });

    if (plistFile) {
      const content = await plistFile.async('string');
      const bundleMatch = content.match(/<key>CFBundleIdentifier<\/key>[\s\r\n]*<string>([^<]+)<\/string>/i);
      if (bundleMatch && bundleMatch[1]) {
        document.getElementById('bundleId').value = bundleMatch[1].trim();
      }

      const nameMatch = content.match(/<key>(?:CFBundleDisplayName|CFBundleName)<\/key>[\s\r\n]*<string>([^<]+)<\/string>/i);
      if (nameMatch && nameMatch[1]) {
        document.getElementById('appName').value = nameMatch[1].trim();
      } else {
        document.getElementById('appName').value = selectedFile.name.replace(/\.ipa$/i, '');
      }
      status.innerText = "تم استخراج الاسم والبندل بدقة، يمكنك تعديلهما.";
    }
  } catch (e) {
    status.innerText = "يمكنك كتابة الاسم والبندل يدوياً.";
  }
}

function uploadFileWithProgress(file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    const formData = new FormData();
    formData.append('file', file);

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable && onProgress) {
        onProgress(Math.round((e.loaded / e.total) * 100));
      }
    };

    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          const res = JSON.parse(xhr.responseText);
          if (res.data && res.data.url) {
            // تحويل الرابط لرابط مباشر متوافق مع Apple OTA
            const directUrl = res.data.url.replace('tmpfiles.org/', 'tmpfiles.org/dl/');
            resolve(directUrl);
          } else {
            reject(new Error("رد غير صالح من خادم الرفع"));
          }
        } catch(err) {
          reject(new Error("خطأ في معالجة بيانات الرفع"));
        }
      } else {
        reject(new Error("خطأ في الاتصال بالخادم: " + xhr.status));
      }
    };

    xhr.onerror = () => reject(new Error("فشل الاتصال بالإنترنت"));
    xhr.open('POST', 'https://tmpfiles.org/api/v1/upload', true);
    xhr.send(formData);
  });
}

async function processUpload() {
  if (!selectedFile) {
    alert('يرجى اختيار ملف IPA من الملفات أولاً');
    return;
  }

  const appName = document.getElementById('appName').value.trim() || 'App';
  const bundleId = document.getElementById('bundleId').value.trim() || 'com.app';
  const status = document.getElementById('statusText');
  const actionBtn = document.getElementById('actionBtn');
  const installBtn = document.getElementById('installBtn');
  const progContainer = document.getElementById('progContainer');
  const progBar = document.getElementById('progBar');

  installBtn.style.display = 'none';
  status.classList.remove('error-msg');
  progContainer.style.display = 'block';
  progBar.style.width = '0%';
  actionBtn.disabled = true;

  try {
    status.innerText = "جاري رفع ملف الـ IPA... يرجى الانتظار";

    const directIpaUrl = await uploadFileWithProgress(selectedFile, (p) => {
      progBar.style.width = p + '%';
      status.innerText = `جاري رفع التطبيق: ${p}%`;
    });

    status.innerText = "تم رفع التطبيق بنجاح! جاري إعداد ملف التثبيت المباشر...";

    const manifest = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>items</key>
  <array>
    <dict>
      <key>assets</key>
      <array>
        <dict>
          <key>kind</key>
          <string>software-package</string>
          <key>url</key>
          <string>${directIpaUrl}</string>
        </dict>
      </array>
      <key>metadata</key>
      <dict>
        <key>bundle-identifier</key>
        <string>${bundleId}</string>
        <key>bundle-version</key>
        <string>1.0</string>
        <key>kind</key>
        <string>software</string>
        <key>title</key>
        <string>${appName}</string>
      </dict>
    </dict>
  </array>
</dict>
</plist>`;

    const plistBlob = new Blob([manifest], { type: 'text/xml' });
    const plistFile = new File([plistBlob], 'manifest.plist', { type: 'text/xml' });
    const directPlistUrl = await uploadFileWithProgress(plistFile);

    const otaUrl = `itms-services://?action=download-manifest&url=${encodeURIComponent(directPlistUrl)}`;

    installBtn.href = otaUrl;
    installBtn.style.display = 'block';
    installBtn.innerText = `تثبيت ${appName} على الآيفون مباشرة`;

    progContainer.style.display = 'none';
    status.innerText = "تم التجهيز بنجاح تام! اضغط الزر الأخضر بالأسفل لتثبيت التطبيق.";

  } catch (err) {
    progContainer.style.display = 'none';
    status.classList.add('error-msg');
    status.innerText = err.message || "حدث خطأ غير متوقع، يرجى إعادة المحاولة.";
  } finally {
    actionBtn.disabled = false;
  }
}
</script>

</body>
</html>
