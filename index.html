<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة عبدالإله | تثبيت تطبيقات iOS</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0e14;
      --card: #151921;
      --border: #232936;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --success: #238636;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 6px; }
    p.sub { text-align: center; color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }
    .group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text-dim); }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b0e14;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-install {
      display: none;
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      background: var(--success);
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>منصة عبدالإله</h1>
  <p class="sub">تثبيت وتوليد روابط تطبيقات iOS المباشرة (OTA)</p>

  <div class="group">
    <label>رابط ملف الـ IPA المباشر (HTTPS):</label>
    <input type="text" id="ipaUrl" placeholder="https://example.com/app.ipa">
  </div>

  <div class="group">
    <label>اسم التطبيق:</label>
    <input type="text" id="appName" placeholder="مثال: تطبيق عبدالإله">
  </div>

  <div class="group">
    <label>معرف الحزمة (Bundle ID):</label>
    <input type="text" id="bundleId" placeholder="مثال: com.abdulelah.app">
  </div>

  <button class="btn" onclick="generateLink()">توليد رابط التثبيت المباشر</button>

  <a id="installBtn" class="btn-install" href="#">تثبيت على الآيفون مباشرة</a>
</div>

<script>
function generateLink() {
  const ipaUrl = document.getElementById('ipaUrl').value.trim();
  const appName = document.getElementById('appName').value.trim() || 'تطبيق جديد';
  const bundleId = document.getElementById('bundleId').value.trim() || 'com.abdulelah.app';

  if (!ipaUrl.startsWith('https://')) {
    alert('يرجى وضع رابط IPA مباشر يبدأ بـ https://');
    return;
  }

  const manifest = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>items</key>
  <array>
    <dict>
      <key>assets</key>
      <array>
        <dict>
          <key>kind</key>
          <string>software-package</string>
          <key>url</key>
          <string>${ipaUrl}</string>
        </dict>
      </array>
      <key>metadata</key>
      <dict>
        <key>bundle-identifier</key>
        <string>${bundleId}</string>
        <key>bundle-version</key>
        <string>1.0</string>
        <key>kind</key>
        <string>software</string>
        <key>title</key>
        <string>${appName}</string>
      </dict>
    </dict>
  </array>
</dict>
</plist>`;

  // تحويل المانيفست لرابط مباشر
  const encodedManifest = encodeURIComponent(manifest);
  const dataUri = `data:text/xml;charset=utf-8,${encodedManifest}`;
  const otaUrl = `itms-services://?action=download-manifest&url=${dataUri}`;

  const btn = document.getElementById('installBtn');
  btn.href = otaUrl;
  btn.style.display = 'block';
  btn.innerText = `تثبيت ${appName} على الآيفون`;
}
</script>

</body>
</html>
