<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة عبدالإله | تثبيت وتوقيع تطبيقات iOS</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #151921;
      --border: #232936;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --success: #238636;
      --error: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 6px; }
    p.sub { text-align: center; color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }
    .group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text-dim); }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b0e14;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    .file-box {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      background: #0b0e14;
      cursor: pointer;
      font-size: 14px;
    }
    .file-box input { display: none; }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-install {
      display: none;
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      background: var(--success);
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
    }
    .status { margin-top: 12px; text-align: center; font-size: 13px; color: #58a6ff; line-height: 1.5; }
    .error-msg { color: var(--error) !important; }
  </style>
</head>
<body>

<div class="card">
  <h1>منصة عبدالإله</h1>
  <p class="sub">رفع وتثبيت تطبيقات iOS من ملفات الجهاز مباشرة</p>

  <div class="group">
    <label>اختر ملف التطبيق (IPA):</label>
    <div class="file-box" onclick="document.getElementById('ipaFile').click()">
      <span id="ipaLabel">اضغط لاختيار ملف IPA من الملفات</span>
      <input type="file" id="ipaFile" accept=".ipa" onchange="handleFileSelect(this)">
    </div>
  </div>

  <div class="group">
    <label>اسم التطبيق:</label>
    <input type="text" id="appName" placeholder="اسم التطبيق">
  </div>

  <div class="group">
    <label>معرف الحزمة (Bundle ID):</label>
    <input type="text" id="bundleId" placeholder="معرف الحزمة">
  </div>

  <button class="btn" id="actionBtn" onclick="processUploadAndInstall()">رفع وتجهيز التثبيت</button>
  
  <div id="statusText" class="status"></div>
  <a id="installBtn" class="btn-install" href="#">تثبيت التطبيق على الآيفون مباشرة</a>
</div>

<script>
const REPO_OWNER = "ip5nt1234-creator";
const REPO_NAME = "Ipa";

// فك تشفير التوكن داخلياً بدون إظهاره للمستخدمين
const _0x1a = ["Z2hwX1dBZ1NVT1FaY1BKZ1Z0RHQ2UWxPS1g5QWJORU51ejNYVVpwUg=="];
const TOKEN = atob(_0x1a[0]);

let selectedFile = null;

async function handleFileSelect(input) {
  if (!input.files || !input.files[0]) return;
  selectedFile = input.files[0];
  document.getElementById('ipaLabel').innerText = "تم اختيار: " + selectedFile.name;
  
  const status = document.getElementById('statusText');
  status.classList.remove('error-msg');
  status.innerText = "جاري استخراج بيانات التطبيق الأصلية...";

  try {
    const zip = await JSZip.loadAsync(selectedFile);
    let plistFile = null;

    zip.forEach((relativePath, file) => {
      if (/^Payload\/[^\/]+\.app\/Info\.plist$/i.test(relativePath)) {
        plistFile = file;
      }
    });

    if (plistFile) {
      const content = await plistFile.async('string');
      const bundleMatch = content.match(/<key>CFBundleIdentifier<\/key>[\s\r\n]*<string>([^<]+)<\/string>/i);
      if (bundleMatch && bundleMatch[1]) {
        document.getElementById('bundleId').value = bundleMatch[1].trim();
      }

      const nameMatch = content.match(/<key>(?:CFBundleDisplayName|CFBundleName)<\/key>[\s\r\n]*<string>([^<]+)<\/string>/i);
      if (nameMatch && nameMatch[1]) {
        document.getElementById('appName').value = nameMatch[1].trim();
      } else {
        document.getElementById('appName').value = selectedFile.name.replace(/\.ipa$/i, '');
      }
      status.innerText = "تم استخراج الاسم والبندل بدقة، يمكنك تعديلهما إذا رغبت.";
    } else {
      setFallbackData();
    }
  } catch (e) {
    setFallbackData();
  }
}

function setFallbackData() {
  const cleanName = selectedFile.name.replace(/\.ipa$/i, '');
  if (!document.getElementById('appName').value) {
    document.getElementById('appName').value = cleanName;
  }
  if (!document.getElementById('bundleId').value) {
    document.getElementById('bundleId').value = 'com.abdulelah.' + cleanName.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
  }
  document.getElementById('statusText').innerText = "تم تعيين البيانات التلقائية.";
}

function uploadAssetViaXHR(uploadUrl, data, contentType) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', uploadUrl, true);
    xhr.setRequestHeader('Authorization', `Bearer ${TOKEN}`);
    xhr.setRequestHeader('Content-Type', contentType);

    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        resolve(JSON.parse(xhr.responseText));
      } else {
        reject(new Error("خطأ في رفع الملف برقم: " + xhr.status));
      }
    };
    xhr.onerror = () => reject(new Error("تعذر إرسال الملف من متصفح السفاري"));
    xhr.send(data);
  });
}

async function processUploadAndInstall() {
  if (!selectedFile) {
    alert('يرجى اختيار ملف IPA من الملفات أولاً');
    return;
  }

  const appName = document.getElementById('appName').value.trim() || 'App';
  const bundleId = document.getElementById('bundleId').value.trim() || 'com.app';
  const status = document.getElementById('statusText');
  const actionBtn = document.getElementById('actionBtn');
  const installBtn = document.getElementById('installBtn');

  installBtn.style.display = 'none';
  status.classList.remove('error-msg');
  actionBtn.disabled = true;

  try {
    status.innerText = "1/3 جاري تهيئة رابط التثبيت السحابي...";
    const tag = "v" + Date.now();

    const relRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${TOKEN}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        tag_name: tag,
        name: `App: ${appName}`,
        draft: false,
        prerelease: false
      })
    });

    if (!relRes.ok) throw new Error("تعذر الوصول لمستودع GitHub، تأكد من صلاحيات الرابط");
    const relData = await relRes.json();
    const rawUploadUrl = relData.upload_url.split('{')[0];

    status.innerText = "2/3 جاري رفع الـ IPA إلى السيرفر... يرجى الانتظار";
    const cleanFileName = (appName.replace(/[^a-zA-Z0-9]/g, '_') || 'app') + '.ipa';
    
    const ipaData = await uploadAssetViaXHR(`${rawUploadUrl}?name=${cleanFileName}`, selectedFile, 'application/octet-stream');
    const directIpaUrl = ipaData.browser_download_url;

    status.innerText = "3/3 جاري توليد شهادة التثبيت المباشر...";
    const manifest = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>items</key>
  <array>
    <dict>
      <key>assets</key>
      <array>
        <dict>
          <key>kind</key>
          <string>software-package</string>
          <key>url</key>
          <string>${directIpaUrl}</string>
        </dict>
      </array>
      <key>metadata</key>
      <dict>
        <key>bundle-identifier</key>
        <string>${bundleId}</string>
        <key>bundle-version</key>
        <string>1.0</string>
        <key>kind</key>
        <string>software</string>
        <key>title</key>
        <string>${appName}</string>
      </dict>
    </dict>
  </array>
</dict>
</plist>`;

    const plistBlob = new Blob([manifest], { type: 'text/xml' });
    const plistData = await uploadAssetViaXHR(`${rawUploadUrl}?name=manifest.plist`, plistBlob, 'text/xml');
    const directPlistUrl = plistData.browser_download_url;

    const otaUrl = `itms-services://?action=download-manifest&url=${encodeURIComponent(directPlistUrl)}`;

    installBtn.href = otaUrl;
    installBtn.style.display = 'block';
    installBtn.innerText = `تثبيت ${appName} على الجهاز`;
    status.innerText = "تم التجهيز بنجاح تام! اضغط الزر الأخضر للتحميل المباشر.";

  } catch (err) {
    status.classList.add('error-msg');
    status.innerText = err.message || "حدث خطأ غير متوقع، يرجى المحاولة ثانية.";
  } finally {
    actionBtn.disabled = false;
  }
}
</script>

</body>
</html>
