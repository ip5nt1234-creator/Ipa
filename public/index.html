<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة عبدالإله | توقيع وتثبيت تطبيقات iOS</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --success: #238636;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 30px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 6px; }
    .header p { color: var(--text-dim); font-size: 14px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-dim); }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0d1117;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input[type="file"] {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px dashed var(--border);
      background: #0d1117;
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .status-card {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      display: none;
      text-align: center;
    }
    .btn-install {
      background: var(--success);
      margin-top: 12px;
      text-decoration: none;
      color: white;
      display: inline-block;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>منصة عبدالإله</h1>
    <p>توقيع وتثبيت تطبيقات iOS المباشر (OTA)</p>
  </div>

  <form id="signerForm">
    <div class="form-group">
      <label>1. ملف التطبيق (IPA):</label>
      <input type="file" id="ipa" accept=".ipa" required>
    </div>

    <div class="form-group">
      <label>2. ملف الشهادة (.p12):</label>
      <input type="file" id="p12" accept=".p12" required>
    </div>

    <div class="form-group">
      <label>3. كلمة سر الشهادة (إن وجدت):</label>
      <input type="password" id="password" placeholder="أدخل كلمة المرور">
    </div>

    <div class="form-group">
      <label>4. ملف الموبايل بروفجن (.mobileprovision):</label>
      <input type="file" id="provision" accept=".mobileprovision" required>
    </div>

    <div class="form-group">
      <label>اسم التطبيق (اختياري):</label>
      <input type="text" id="appName" placeholder="مثال: سناب بلس">
    </div>

    <div class="form-group">
      <label>معرف الحزمة Bundle ID (اختياري):</label>
      <input type="text" id="bundleId" placeholder="مثال: com.abdulelah.app">
    </div>

    <button type="submit" id="submitBtn" class="btn">بدء التوقيع والتجهيز</button>
  </form>

  <div id="statusBox" class="status-card">
    <p id="statusMsg"></p>
    <a id="otaBtn" href="#" class="btn-install" style="display: none;">تثبيت على الآيفون مباشرة</a>
  </div>
</div>

<script>
  const form = document.getElementById('signerForm');
  const btn = document.getElementById('submitBtn');
  const statusBox = document.getElementById('statusBox');
  const statusMsg = document.getElementById('statusMsg');
  const otaBtn = document.getElementById('otaBtn');

  form.onsubmit = async (e) => {
    e.preventDefault();

    const formData = new FormData();
    formData.append('ipa', document.getElementById('ipa').files[0]);
    formData.append('p12', document.getElementById('p12').files[0]);
    formData.append('provision', document.getElementById('provision').files[0]);
    formData.append('password', document.getElementById('password').value);
    formData.append('appName', document.getElementById('appName').value);
    formData.append('bundleId', document.getElementById('bundleId').value);

    btn.disabled = true;
    btn.innerText = 'جاري التوقيع... انتظر قليلاً';
    statusBox.style.display = 'block';
    statusBox.style.background = '#1f242c';
    statusMsg.innerText = 'يتم الآن فك وتوقيع التطبيق وتجهيز رابط التثبيت...';
    otaBtn.style.display = 'none';

    try {
      const res = await fetch('/api/sign', { method: 'POST', body: formData });
      const data = await res.json();

      if (!res.ok || !data.success) {
        throw new Error(data.error || 'حدث خطأ أثناء المعالجة');
      }

      statusBox.style.background = '#1c3829';
      statusMsg.innerText = 'تم التوقيع بنجاح! اضغط بالأسفل للتثبيت (افتح الرابط من Safari)';
      otaBtn.href = data.otaUrl;
      otaBtn.style.display = 'block';
    } catch (err) {
      statusBox.style.background = '#3c1e1e';
      statusMsg.innerText = err.message;
    } finally {
      btn.disabled = false;
      btn.innerText = 'بدء التوقيع والتجهيز';
    }
  };
</script>

</body>
</html>
