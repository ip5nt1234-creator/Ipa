<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>متجر عبدالإله</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: rgba(22, 27, 34, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #2f81f7;
      --accent: #a371f7;
      --tg-color: #24A1DE;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --success: #238636;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 70px; }
    
    header {
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand h1 { font-size: 20px; font-weight: 900; background: linear-gradient(135deg, #58a6ff, #bc8cff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand p { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

    .tg-top-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(36, 161, 222, 0.15);
      color: var(--tg-color);
      border: 1px solid rgba(36, 161, 222, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .container { max-width: 520px; margin: 0 auto; padding: 20px 16px; }

    .search-box {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: #fff;
      font-size: 14px;
      outline: none;
      backdrop-filter: blur(10px);
      margin-bottom: 20px;
    }
    .search-box:focus { border-color: var(--primary); }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .app-header { display: flex; gap: 14px; align-items: center; }
    .app-icon { width: 62px; height: 62px; border-radius: 15px; object-fit: cover; border: 1px solid var(--border); background: #111; flex-shrink: 0; }
    
    .app-details { flex: 1; min-width: 0; }
    .app-title { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 8px; background: rgba(188, 140, 255, 0.15); color: #bc8cff; border: 1px solid rgba(188, 140, 255, 0.3); }
    .app-cat { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

    .price-tag {
      background: rgba(35, 134, 54, 0.15);
      border: 1px solid rgba(35, 134, 54, 0.3);
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 800;
      color: #3fb950;
      display: inline-block;
      align-self: flex-start;
    }

    .app-desc { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

    .btn-buy {
      background: linear-gradient(135deg, #1f6feb, #238636);
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(31, 111, 235, 0.3);
    }
    
    .loading { text-align: center; color: var(--text-dim); padding: 50px; font-size: 14px; }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <h1>متجر عبدالإله</h1>
    <p>تطبيقات بلس والنسخ الحصرية</p>
  </div>
  <a class="tg-top-btn" href="https://t.me/IRR6X" target="_blank">
    <span>الدعم</span>
    <span>✈️</span>
  </a>
</header>

<div class="container">
  <input type="text" id="search" class="search-box" placeholder="ابحث عن تطبيق أو نسخة..." oninput="filterStore()">

  <div id="storeList">
    <div class="loading">جاري فتح المتجر...</div>
  </div>
</div>

<script>
const TELEGRAM_USER = "IRR6X";
let storeData = [];

async function initStore() {
  try {
    const res = await fetch('/api/apps');
    storeData = await res.json();
    displayApps(storeData);
  } catch (e) {
    document.getElementById('storeList').innerHTML = '<div class="loading">فشل تحميل المتجر. تأكد من تشغيل السيرفر.</div>';
  }
}

function displayApps(items) {
  const box = document.getElementById('storeList');
  if (!items.length) {
    box.innerHTML = '<div class="loading">لا توجد تطبيقات مطابقة لبحثك</div>';
    return;
  }

  box.innerHTML = items.map(app => {
    const tgMsg = encodeURIComponent(`السلام عليكم، أحتاج شراء/تفعيل: ${app.name} (${app.price})`);
    const tgLink = `https://t.me/${TELEGRAM_USER}?start=${tgMsg}`;

    return `
      <div class="app-card">
        <div class="app-header">
          <img src="${app.icon}" class="app-icon" onerror="this.src='https://img.icons8.com/color/512/apple-app-store--v1.png'">
          <div class="app-details">
            <div class="app-title">
              ${app.name}
              <span class="badge">${app.badge}</span>
            </div>
            <div class="app-cat">${app.category}</div>
          </div>
        </div>

        <div class="price-tag">${app.price}</div>

        <p class="app-desc">${app.description}</p>

        <a class="btn-buy" href="${tgLink}" target="_blank">
          <span>طلب وتفعيل عبر تيليجرام</span>
          <span>✈️</span>
        </a>
      </div>
    `;
  }).join('');
}

function filterStore() {
  const val = document.getElementById('search').value.toLowerCase();
  const res = storeData.filter(x => x.name.toLowerCase().includes(val) || x.description.toLowerCase().includes(val));
  displayApps(res);
}

initStore();
</script>

</body>
</html>
